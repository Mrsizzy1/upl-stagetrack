# Nginx de production : HTTPS obligatoire (la caméra du navigateur l'exige), interface statique, proxy /api.
# Certificats attendus dans /etc/nginx/certs (voir docs/DEPLOIEMENT.md).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Import de fichiers (5 Mo) et photos (2 Mo).
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Pas de add_header dans les blocs location : il annulerait tous les en-têtes de sécurité
    # déclarés plus haut (CSP, HSTS, X-Frame-Options…). Le cache est réglé par « expires ».
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Application monopage : toute autre adresse renvoie index.html (Cache-Control: no-cache).
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}

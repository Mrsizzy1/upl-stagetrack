# Déploiement de production sur un serveur Linux (voir docs/DEPLOIEMENT.md).
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Aucun port publié : la base n'est joignable que par l'API.

  provision-db:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/provision/provision.sh"]
    volumes:
      - ./deploy/postgres-roles.sql:/provision/roles.sql:ro
      - ./deploy/provision-production-db.sh:/provision/provision.sh:ro

  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: "no"
    depends_on:
      provision-db:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stagetrack_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  seed:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stagetrack_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Lubumbashi}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FULLNAME: ${SEED_ADMIN_FULLNAME:-Administrateur StageTrack}
    command: ["node", "dist/cli/seed.js"]

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://stagetrack_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Lubumbashi}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      QR_TOKEN_ENCRYPTION_KEY: ${QR_TOKEN_ENCRYPTION_KEY}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CLOSURE_JOB_ENABLED: ${CLOSURE_JOB_ENABLED:-true}
      STORAGE_DIR: /app/backend/storage
    volumes:
      - storage:/app/backend/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  storage:
